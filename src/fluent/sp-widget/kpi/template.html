<div class="ra-kpi-row row">
  <div class="col-md-4 col-sm-4 col-xs-12">
    <div class="ra-kpi-tile ra-kpi-tile--warning">
      <div class="ra-kpi-value">{{c.data.endingSoon}}</div>
      <div class="ra-kpi-label">Ending Within 30 Days</div>
    </div>
  </div>
  <div class="col-md-4 col-sm-4 col-xs-12">
    <div class="ra-kpi-tile ra-kpi-tile--info">
      <div class="ra-kpi-value">{{c.data.activeContracts}}</div>
      <div class="ra-kpi-label">Active Contracts (Companies)</div>
    </div>
  </div>
  <div class="col-md-4 col-sm-4 col-xs-12">
    <div class="ra-kpi-tile ra-kpi-tile--success">
      <div class="ra-kpi-value">{{c.data.placesAllocated}}</div>
      <div class="ra-kpi-label">Places Allocated</div>
    </div>
  </div>
</div>
