<div class="panel panel-default ra-chart-widget">
  <div class="panel-heading">
    <h3 class="panel-title">Total Allocation % by Consultant</h3>
  </div>
  <div class="panel-body">
    <div class="ra-chart-canvas-wrap">
      <canvas class="ra-chart-canvas"></canvas>
    </div>
    <div class="ra-chart-legend">
      <span class="ra-legend-swatch ra-legend-swatch--warning"></span> Under 80% — may need more assignments
      <span class="ra-legend-swatch ra-legend-swatch--info"></span> 80%+ allocated
    </div>
    <div class="alert alert-warning ra-chart-alert" ng-if="c.data.needsAttention.length">
      <strong>Needs more assignments:</strong>
      <span ng-repeat="person in c.data.needsAttention track by $index">{{person.name}} ({{person.total}}%)<span ng-if="!$last">, </span></span>
    </div>
  </div>
</div>
